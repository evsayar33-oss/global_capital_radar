name: Independent ETFIQ and native source research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native_research.py'
      - 'test_native_research.py'
      - '.github/workflows/native_source_research.yml'
  pull_request:
    paths:
      - 'native_research.py'
      - 'test_native_research.py'
      - '.github/workflows/native_source_research.yml'
  schedule:
    - cron: '17 13 * * 1-5'
permissions:
  contents: write
concurrency:
  group: capital-radar
  cancel-in-progress: false
jobs:
  independent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install xlrd==2.0.2
      - run: python -m unittest -v
      - id: collect
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python native_research.py
      - if: github.event_name != 'pull_request' && always()
        run: |
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/native_research
          if test -f NATIVE_RESEARCH.md; then git add NATIVE_RESEARCH.md; fi
          if ! git diff --cached --quiet; then
            git commit -m "Independent native source research evidence"
            git push
          fi
      - if: steps.collect.outcome == 'failure'
        run: exit 1
