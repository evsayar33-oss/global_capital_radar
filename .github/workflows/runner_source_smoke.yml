name: Public source runner smoke test
on:
  pull_request:
    paths:
      - 'source_recovery.py'
      - 'runner_sources.py'
      - 'runner_recovery.py'
      - 'test_runner_sources.py'
      - '.github/workflows/runner_source_smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real_sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_runner_sources test_source_recovery
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - run: python runner_recovery.py
