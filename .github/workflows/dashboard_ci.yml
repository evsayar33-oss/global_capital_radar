name: Dashboard regression tests
on:
  push:
    branches: ['fix/dashboard-source-health']
  pull_request:
    paths:
      - 'dashboard_data.py'
      - 'requirements.txt'
      - 'requirements-research.txt'
      - 'flow_view.py'
      - 'streamlit_app.py'
      - 'flow_continuity.py'
      - 'issuer_flow_history.py'
      - 'gold_flow_history.py'
      - 'test_gold_flow_history.py'
      - 'test_issuer_flow_history.py'
      - 'public_flow_source.py'
      - 'test_public_flow_source.py'
      - 'test_dashboard_data.py'
      - 'test_flow_continuity.py'
      - '.github/workflows/dashboard_ci.yml'
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-research.txt
      - run: python -m unittest -v

  deployment-python314:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # Match the deployed UI environment, without native source builds.
      - run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest -v test_dashboard_data

