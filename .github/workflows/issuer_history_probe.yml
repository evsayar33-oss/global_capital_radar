name: Official issuer history validation
on:
  push:
    branches: ['fix/issuer-history-recovery']
  pull_request:
    paths: ['issuer_flow_history.py', 'test_issuer_flow_history.py', 'flow_continuity.py', '.github/workflows/issuer_history_probe.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-research.txt
      - run: python -m unittest -v
      - run: python issuer_flow_history.py
      - run: python flow_continuity.py
