name: Gold archive schema probe
on:
  push:
    branches: ['fix/issuer-history-recovery']
    paths: ['.github/workflows/gold_history_probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install openpyxl==3.1.5
      - run: |
          python - <<'PY'
          import urllib.request,openpyxl,io
          url='https://api.spdrgoldshares.com/api/v1/historical-archive?exchange=NYSE&lang=en&product=gld'
          b=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=60).read()
          open('gld.xlsx','wb').write(b)
          w=openpyxl.load_workbook(io.BytesIO(b),read_only=True,data_only=True)
          for s in w:
              print('SHEET',s.title,s.max_row,s.max_column)
              rows=list(s.values)
              for r in rows[:8]+rows[-3:]:print(r)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold-official-workbook
          path: gld.xlsx
          retention-days: 1
