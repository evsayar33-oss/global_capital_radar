name: Independent ETFIQ and native source research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native_research.py'
      - 'macro_recovery.py'
      - 'test_macro_recovery.py'
      - 'source_recovery.py'
      - 'runner_sources.py'
      - 'runner_recovery.py'
      - 'test_runner_sources.py'
      - 'test_source_recovery.py'
      - 'native_adapters.py'
      - 'test_native_adapters.py'
      - 'secondary_sources.py'
      - 'test_native_research.py'
      - '.github/workflows/native_source_research.yml'
  pull_request:
    paths:
      - 'native_research.py'
      - 'macro_recovery.py'
      - 'test_macro_recovery.py'
      - 'source_recovery.py'
      - 'runner_sources.py'
      - 'runner_recovery.py'
      - 'test_runner_sources.py'
      - 'test_source_recovery.py'
      - 'native_adapters.py'
      - 'test_native_adapters.py'
      - 'secondary_sources.py'
      - 'test_native_research.py'
      - '.github/workflows/native_source_research.yml'
  schedule:
    - cron: '17 13 * * 1-5'
permissions:
  contents: write
concurrency:
  group: capital-radar-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install xlrd==2.0.2 exchange-calendars==4.13.1 pandas==2.2.3
      - run: python -m unittest -v
      - if: github.event_name != 'pull_request'
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - id: collect
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python native_research.py
      - id: persist
        if: github.event_name != 'pull_request' && always()
        run: |
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history/native_research
          if test -f NATIVE_RESEARCH.md; then git add NATIVE_RESEARCH.md; fi
          if ! git diff --cached --quiet; then
            git commit -m "Independent native source research evidence"
            bash scripts/persist_observations.sh "$RUNNER_TEMP/observation-recovery.patch"
          fi
      - name: Preserve unpushed observation patch
        if: always() && steps.persist.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: observation-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observation-recovery.patch
          if-no-files-found: warn
          retention-days: 30
      - if: steps.collect.outcome == 'failure'
        run: exit 1
