name: Küresel sermaye radarı
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'adaptive_flow.py'
      - 'adaptive_evaluation.py'
      - 'secondary_sources.py'
      - 'rotation.py'
      - 'flow_continuity.py'
      - 'public_flow_source.py'
      - 'test_public_flow_source.py'
      - 'experiments.py'
      - 'validation.py'
      - 'streamlit_app.py'
      - 'radar.py'
      - 'macro_sources.py'
      - 'keyed_sources.py'
      - 'dashboard_data.py'
      - 'flow_view.py'
      - 'telegram_report.py'
      - 'price_context.py'
      - 'evaluate_rotation.py'
      - '.github/workflows/radar.yml'
  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/radar.yml'
  schedule:
    - cron: '27 23 * * *'
    # Source polling during US publication hours; full macro/evaluation stays daily.
    - cron: '17 13-22 * * 1-5'
    - cron: '17 0-3 * * 2-6'
permissions:
  contents: write
concurrency:
  group: capital-radar-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  unit-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m unittest -v
  research:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Queued runs must start from the latest persisted main snapshot, not a stale event SHA.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Start bounded resource telemetry
        continue-on-error: true
        run: python3 scripts/resource_probe.py start
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest -v
      - id: collect
        if: github.event_name != 'schedule' || github.event.schedule == '27 23 * * *'
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python3 radar.py
      - id: rotation
        continue-on-error: true
        run: python3 rotation.py
      - id: evaluation
        if: github.event_name != 'schedule' || github.event.schedule == '27 23 * * *'
        continue-on-error: true
        run: python3 evaluate_rotation.py
      - id: validation
        continue-on-error: true
        run: python3 validation.py
      - name: Telegram değişim bildirimi
        continue-on-error: true
        id: telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 telegram_report.py
      - name: Gözlem ve tahminleri kaydet
        id: persist
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history
          for report in LATEST.md ROTATION.md FORWARD.md ADAPTIVE.md; do
            if test -f "$report"; then git add "$report"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Günlük sermaye gözlemi"
            bash scripts/persist_observations.sh "$RUNNER_TEMP/observation-recovery.patch"
          fi
      - name: Preserve unpushed observation patch
        if: always() && steps.persist.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: observation-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observation-recovery.patch
          if-no-files-found: warn
          retention-days: 30
      - if: steps.collect.outcome == 'failure' || steps.rotation.outcome == 'failure' || steps.evaluation.outcome == 'failure' || steps.telegram.outcome == 'failure' || steps.validation.outcome == 'failure'
        run: exit 1
      - name: Report runner capacity
        if: always()
        continue-on-error: true
        run: |
          probe="$RUNNER_TEMP/repo-resource-$GITHUB_RUN_ID-$GITHUB_JOB/probe.py"
          if test -f "$probe"; then python3 "$probe" finish; else echo "::warning::Resource telemetry unavailable"; fi

