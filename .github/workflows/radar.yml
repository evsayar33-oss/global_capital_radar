name: Küresel sermaye radarı
on:
  workflow_dispatch:
  schedule:
    - cron: '27 23 * * *'
permissions:
  contents: write
concurrency:
  group: capital-radar
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest -v
      - id: collect
        continue-on-error: true
        run: python3 radar.py
      - id: rotation
        continue-on-error: true
        run: python3 rotation.py
      - id: evaluation
        continue-on-error: true
        run: python3 evaluate_rotation.py
      - id: validation
        continue-on-error: true
        run: python3 validation.py
      - name: Telegram değişim bildirimi
        continue-on-error: true
        id: telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 telegram_report.py
      - name: Gözlem ve tahminleri kaydet
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history
          for report in LATEST.md ROTATION.md FORWARD.md; do
            if test -f "$report"; then git add "$report"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Günlük sermaye gözlemi"
            git push
          fi
      - if: steps.collect.outcome == 'failure' || steps.rotation.outcome == 'failure' || steps.evaluation.outcome == 'failure' || steps.telegram.outcome == 'failure' || steps.validation.outcome == 'failure'
        run: exit 1
